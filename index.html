<h1>衛生講話 納品メール</h1>
<p>本アプリは、産業保健の衛生講話資料（PowerPointファイル）を作成者本人のGmailアカウントから所定の宛先へ送信するための、個人用の送信ツールです。</p>
<h2>機能</h2>
<ul>
<li>作成済みの講話資料を添付ファイルとしてメール送信します（件名＝ファイル名）。</li>
<li>Gmail API の <code>gmail.send</code> スコープ（メール送信のみ）を使用します。受信メールの閲覧・変更・削除は行いません。</li>
</ul>
